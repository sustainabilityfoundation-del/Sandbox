version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 7 needs Node 20.19+; the Amplify build image provides nvm.
        - nvm install 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
