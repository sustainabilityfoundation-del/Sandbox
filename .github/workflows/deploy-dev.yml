name: Deploy dev (manual)

# Manual only: there is no push, pull_request or schedule trigger, and nothing deploys unless the "deploy" input is ticked.
# The only configuration it needs is the repository VARIABLE AWS_DEPLOY_ROLE_ARN (the role created by the Ews-GithubOidc stack).
# No access keys and no secrets are stored in GitHub; AWS accepts the run's OpenID Connect token for that one role, and only for
# this repository on the branch named in the stack (main by default). Do not add an `environment:` to the deploy job: it changes the
# token subject and the role's trust policy would no longer match.
# Run order and recovery: docs/infrastructure/DEPLOYMENT_RUNBOOK.md.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to AWS (unticked: only type-check, test and synthesize the infrastructure)'
        type: boolean
        default: false
      image_tag:
        description: 'Image tag (blank: the first 12 characters of the commit SHA)'
        type: string
        default: ''
      region:
        description: 'AWS region of the dev environment'
        type: string
        default: 'us-east-2'

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    name: Infrastructure checks (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json
      - run: npm ci --prefix infra/aws
      - run: npm run typecheck --prefix infra/aws
      - run: npm test --prefix infra/aws
      - name: Synthesize (offline, no AWS access)
        run: npm run synth --prefix infra/aws -- -c imageTag=ci
        env:
          CDK_DISABLE_VERSION_CHECK: '1'

  deploy:
    name: Deploy
    needs: checks
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ inputs.region }}
      CDK_DISABLE_VERSION_CHECK: '1'
    steps:
      - name: Require the role variable
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then echo "Set the repository variable AWS_DEPLOY_ROLE_ARN (stack Ews-GithubOidc output DeployRoleArn)." >&2; exit 1; fi
          case "$AWS_REGION" in *[!a-z0-9-]*|'') echo "Unexpected region." >&2; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_SHA::12}}"
          case "$TAG" in *[!A-Za-z0-9._-]*|'') echo "Unexpected image tag." >&2; exit 1;; esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: ews-gh-deploy-dev
      - run: npm ci --prefix infra/aws

      - name: Deploy the data stack (VPC, database, file system, secrets, image repository)
        working-directory: infra/aws
        run: npx cdk deploy Ews-Dev-Data --exclusively --require-approval never

      - name: Build and push the API image (arm64)
        id: image
        run: |
          set -eu
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/ews/api:${{ steps.tag.outputs.value }}"
          if aws ecr describe-images --repository-name ews/api --image-ids imageTag="${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "Image tag already exists (tags are immutable): reusing it."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            docker build -f services/api/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Register the migration task definition with the new image
        working-directory: infra/aws
        run: npx cdk deploy Ews-Dev-Migrate --exclusively --require-approval never -c imageTag=${{ steps.tag.outputs.value }}

      - name: Run the database migration (stops the deployment if it fails)
        run: |
          set -eu
          out() { aws cloudformation describe-stacks --stack-name Ews-Dev-Migrate --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          CLUSTER="$(out Cluster)"; SUBNETS="$(out TaskSubnets)"; SG="$(out TaskSecurityGroup)"
          for v in "$CLUSTER" "$SUBNETS" "$SG"; do case "$v" in *[!A-Za-z0-9,_-]*|'') echo "Unexpected stack output." >&2; exit 1;; esac; done
          TASK="$(aws ecs run-task --cluster "$CLUSTER" --task-definition ews-dev-migrate --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)"
          echo "Migration task started."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)"
          if [ "$CODE" != "0" ]; then
            echo "Migration failed with exit code $CODE. Read the log group /ews/dev/api (stream prefix migrate). The service was not updated." >&2
            exit 1
          fi
          echo "Migration finished: exit code 0."

      - name: Deploy the service
        working-directory: infra/aws
        run: npx cdk deploy Ews-Dev-App --exclusively --require-approval never -c imageTag=${{ steps.tag.outputs.value }}

      - name: Deploy CloudFront and the static site bucket
        working-directory: infra/aws
        run: npx cdk deploy Ews-Dev-Edge --exclusively --require-approval never

      - name: Build and publish the static site
        run: |
          set -eu
          out() { aws cloudformation describe-stacks --stack-name Ews-Dev-Edge --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET="$(out SiteBucket)"; DIST="$(out DistributionId)"
          for v in "$BUCKET" "$DIST"; do case "$v" in *[!A-Za-z0-9._-]*|'') echo "Unexpected stack output." >&2; exit 1;; esac; done
          npm ci
          npm run build
          aws s3 sync dist/ "s3://$BUCKET/" --delete --exclude "*.html" --cache-control "public,max-age=3600"
          aws s3 sync dist/ "s3://$BUCKET/" --exclude "*" --include "*.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" >/dev/null
          echo "Published. The site asks for the password gate; see the runbook for setting it."
